name: Sync Leaderboard Data

on:
  schedule:
    # Hourly at minute 17. The scraper commits only when the source dataset changes.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-content-writes
  cancel-in-progress: false

jobs:
  sync-leaderboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and validate leaderboard
        run: python scripts/sync_leaderboard.py

      - name: Rebuild shared entity catalog
        run: python scripts/build_entity_catalog.py

      - name: Fail on missing leaderboard entity pages or assets
        run: >-
          python scripts/check_leaderboard_entities.py
          --report "$RUNNER_TEMP/leaderboard-entity-gaps.json"

      - name: Validate entity monitor
        run: |
          python -m unittest tests.test_entity_catalog tests.test_leaderboard_entity_check tests.test_leaderboard_sync tests.test_character_build_signal_pages tests.test_build_hub tests.test_build_alias_consolidation tests.test_character_tier_architecture tests.test_maps_shrines_architecture tests.test_tomes_architecture tests.test_weapons_architecture tests.test_stats_architecture
          python -m py_compile scripts/check_leaderboard_entities.py
          python -m py_compile scripts/send_leaderboard_entity_alert.py
          git diff --check

      - name: Commit changed data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboard-data.json data/leaderboard-meta.json data/character-build-signals.json

          if git diff --staged --quiet; then
            echo "Leaderboard source is unchanged; no commit needed."
            exit 0
          fi

          git commit -m "Auto-update leaderboard data"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Send leaderboard failure email
        if: ${{ failure() }}
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PATCH_ALERT_EMAIL: ${{ secrets.PATCH_ALERT_EMAIL }}
        run: >-
          python scripts/send_leaderboard_entity_alert.py
          --report "$RUNNER_TEMP/leaderboard-entity-gaps.json"
