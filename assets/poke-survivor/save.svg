<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300"><rect width="1100" height="300" fill="#eef2fb"/><path d="M0 260H1100" stroke="#c9d3ee" stroke-width="2"/><rect x="24" y="50" width="235" height="174" fill="#24479a" stroke="#24479a" stroke-width="2"/><text x="41" y="87" fill="#ffd23f" font-family="sans-serif" font-size="15" font-weight="700">01 / PRESERVE</text><text x="41" y="131" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="700">Keep newer device</text><text x="41" y="172" fill="#c4d4f5" font-family="sans-serif" font-size="14">Do not clear its storage</text><path d="M266 134h25m-7-7 7 7-7 7" fill="none" stroke="#2f5bc0" stroke-width="2"/><rect x="297" y="50" width="235" height="174" fill="#ffffff" stroke="#24479a" stroke-width="2"/><text x="314" y="87" fill="#2f5bc0" font-family="sans-serif" font-size="15" font-weight="700">02 / IDENTIFY</text><text x="314" y="131" fill="#24479a" font-family="sans-serif" font-size="20" font-weight="700">Domain + account</text><text x="314" y="172" fill="#4b5a82" font-family="sans-serif" font-size="14">Guest, local or cloud?</text><path d="M539 134h25m-7-7 7 7-7 7" fill="none" stroke="#2f5bc0" stroke-width="2"/><rect x="570" y="50" width="235" height="174" fill="#24479a" stroke="#24479a" stroke-width="2"/><text x="587" y="87" fill="#ffd23f" font-family="sans-serif" font-size="15" font-weight="700">03 / SAVE</text><text x="587" y="131" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="700">Read the result</text><text x="587" y="172" fill="#c4d4f5" font-family="sans-serif" font-size="14">Pending is not success</text><path d="M812 134h25m-7-7 7 7-7 7" fill="none" stroke="#2f5bc0" stroke-width="2"/><rect x="843" y="50" width="235" height="174" fill="#ffffff" stroke="#24479a" stroke-width="2"/><text x="860" y="87" fill="#2f5bc0" font-family="sans-serif" font-size="15" font-weight="700">04 / COMPARE</text><text x="860" y="131" fill="#24479a" font-family="sans-serif" font-size="20" font-weight="700">Then check device B</text><text x="860" y="172" fill="#4b5a82" font-family="sans-serif" font-size="14">Keep both states</text></svg>