<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc"><title id="title">A recipe worth planning</title><desc id="desc">An original diagram: Burn and Iron make Bomb. Add Poison to evolve Nuclear Bomb.</desc><defs><pattern id="dots" width="38" height="38" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#473855"/></pattern></defs><rect width="1000" height="760" fill="#251d38"/><rect width="1000" height="760" fill="url(#dots)"/><path d="M90 675 315 120 665 610 900 165" stroke="#61516f" stroke-width="2" fill="none"/><text x="70" y="80" fill="#b9edb3" font-family="sans-serif" font-size="20" letter-spacing="5">RECIPE / 001</text><path d="M285 230 500 350 715 230M500 420v125M760 500 550 570" fill="none" stroke="#b9edb3" stroke-width="5" stroke-dasharray="9 10"/><circle cx="285" cy="210" r="76" fill="#ee806b"/><text x="285" y="218" text-anchor="middle" fill="#251d38" font-family="sans-serif" font-size="27" font-weight="700">BURN</text><circle cx="715" cy="210" r="76" fill="#ddd5e7"/><text x="715" y="218" text-anchor="middle" fill="#251d38" font-family="sans-serif" font-size="27" font-weight="700">IRON</text><rect x="382" y="328" width="236" height="100" rx="50" fill="#b9edb3"/><text x="500" y="391" text-anchor="middle" fill="#251d38" font-family="sans-serif" font-size="36" font-weight="700">BOMB</text><circle cx="790" cy="485" r="63" fill="#b9edb3"/><text x="790" y="492" text-anchor="middle" fill="#251d38" font-family="sans-serif" font-size="20" font-weight="700">POISON</text><rect x="240" y="545" width="450" height="100" rx="16" fill="#fcfaf4"/><text x="465" y="607" text-anchor="middle" fill="#251d38" font-family="sans-serif" font-size="34" font-weight="700">NUCLEAR BOMB</text><text x="70" y="713" fill="#ddd5e7" font-family="sans-serif" font-size="19">A short route first. A stronger branch next.</text></svg>
