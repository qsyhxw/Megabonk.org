name: Validate published integrations
on:
  push:
    branches: [main]
    paths: ['**.html', '**.htm', 'scripts/**', 'assets/**', 'config/**', 'data/pokebonk-*.json', '.github/workflows/validate-integrations.yml']
  pull_request:
    paths: ['**.html', '**.htm', 'scripts/**', 'assets/**', 'config/**', 'data/pokebonk-*.json', '.github/workflows/validate-integrations.yml']
permissions:
  contents: read
jobs:
  static-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify guard rejects integration defects
        run: python scripts/test_integration_guard.py
      - name: Rebuild PokeBonk from versioned source
        run: |
          python scripts/derive_pokebonk_evolution.py
          python scripts/build_pokebonk.py
      - name: Rebuild PokeSurvivor from versioned source
        run: python scripts/build_poke_survivor.py
      - name: Rebuild main-site longtail guides
        run: python scripts/build_longtail_main.py
      - name: Rebuild Survivor Ace task pages
        run: python scripts/build_survivor_ace.py
      - name: Rebuild Azeroth Survivors guides
        run: python scripts/build_azeroth_survivors.py
      - name: Verify public-source sync rejects unsafe updates
        run: |
          python scripts/test_pokebonk_sync.py
          python scripts/test_pokebonk_sync_render.py

      - name: Verify source-derived PokeBonk task data
        run: python scripts/check_pokebonk_depth.py
      - name: Verify PokeBonk fixed-panel engine fixtures
        run: node scripts/test_pokebonk_compare.cjs
      - name: Verify current move, support and purchase decisions
        run: node scripts/test_pokebonk_decisions.cjs
      - name: Verify recorded move upgrades and planned budgets
        run: node scripts/test_pokebonk_progression.cjs
      - name: Verify shared game-section layout and comparison controls
        run: python scripts/check_guide_layout.py
      - name: Compare integration expectations with previous Git revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ci_integrations.py
