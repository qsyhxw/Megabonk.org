<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="200" viewBox="0 0 1100 200" role="img"><title>A status reaction needs an existing prerequisite</title><rect width="1100" height="200" rx="12" fill="#e8efdb"/><text x="25" y="34" font-family="sans-serif" font-size="19" fill="#182d42">A status reaction needs an existing prerequisite</text><rect x="25" y="65" width="330" height="100" rx="8" fill="#fffef8" stroke="#236744"/><text x="40" y="95" fill="#236744" font-family="sans-serif" font-size="14">01</text><text x="40" y="130" fill="#182d42" font-family="sans-serif" font-size="17">Apply the status</text><rect x="385" y="65" width="330" height="100" rx="8" fill="#fffef8" stroke="#236744"/><text x="400" y="95" fill="#236744" font-family="sans-serif" font-size="14">02</text><text x="400" y="130" fill="#182d42" font-family="sans-serif" font-size="17">Use a compatible later hit</text><rect x="745" y="65" width="330" height="100" rx="8" fill="#fffef8" stroke="#236744"/><text x="760" y="95" fill="#236744" font-family="sans-serif" font-size="14">03</text><text x="760" y="130" fill="#182d42" font-family="sans-serif" font-size="17">Check consumption and timing</text></svg>