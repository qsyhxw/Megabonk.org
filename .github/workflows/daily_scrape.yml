name: Sync Leaderboard Data

on:
  schedule:
    # Hourly at minute 17. The scraper commits only when the source dataset changes.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-content-writes
  cancel-in-progress: false

jobs:
  sync-leaderboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and validate leaderboard
        run: python scripts/sync_leaderboard.py

      - name: Commit changed data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboard-data.json data/leaderboard-meta.json data/character-build-signals.json

          if git diff --staged --quiet; then
            echo "Leaderboard source is unchanged; no commit needed."
            exit 0
          fi

          git commit -m "Auto-update leaderboard data"
          git pull --rebase origin main
          git push origin HEAD:main
