name: Sync Leaderboard Data

on:
  schedule:
    # Hourly at minute 17. The scraper commits only when the source dataset changes.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      send_test_email:
        description: Send a Gmail configuration test after a successful sync
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: repository-content-writes
  cancel-in-progress: false

jobs:
  sync-leaderboard:
    runs-on: ubuntu-latest
    # The browser fallback and hosted-runner package mirrors can occasionally
    # take several minutes. Keep a bounded ceiling without cancelling a
    # healthy sync during a transient GitHub/network slowdown.
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install leaderboard browser fallback
        run: |
          python -m pip install --disable-pip-version-check playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: Fetch and validate leaderboard
        # Leave enough of the 15-minute job budget for validation, publishing,
        # and a clear failure result. A killed fetch never replaces cached JSON.
        run: timeout --signal=TERM --kill-after=15s 8m python scripts/sync_leaderboard.py

      - name: Rebuild shared entity catalog
        run: |
          python scripts/build_entity_catalog.py
          python scripts/build_legendary_items_page.py
          python scripts/build_builds_hub.py
          python scripts/build_characters_hub.py

      - name: Fail on missing leaderboard entity pages or assets
        run: >-
          python scripts/check_leaderboard_entities.py
          --report "$RUNNER_TEMP/leaderboard-entity-gaps.json"

      - name: Validate entity monitor
        run: |
          python -m unittest tests.test_golden_tome_metadata tests.test_url_suffix_policy tests.test_entity_catalog tests.test_legendary_items_automation tests.test_leaderboard_entity_check tests.test_leaderboard_sync tests.test_leaderboard_cache_loader tests.test_character_build_signal_pages tests.test_build_hub tests.test_build_alias_consolidation tests.test_character_tier_architecture tests.test_general_tier_hub tests.test_maps_shrines_architecture tests.test_tomes_architecture tests.test_weapons_architecture tests.test_items_architecture tests.test_robinette_currency_intent tests.test_dexecutioner_intent tests.test_stats_architecture tests.test_emoji_heading_fix tests.test_platform_consolidation
          node --test tests/leaderboard-data-loader.test.mjs
          python -m py_compile scripts/normalize_internal_urls.py
          python -m py_compile scripts/check_leaderboard_entities.py
          python -m py_compile scripts/build_builds_hub.py
          python -m py_compile scripts/build_characters_hub.py
          python -m py_compile scripts/build_legendary_items_page.py
          python -m py_compile scripts/send_leaderboard_entity_alert.py
          git diff --check

      - name: Commit changed data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboard-data.json data/leaderboard-meta.json data/character-build-signals.json data/entity-catalog.json guides/builds/index.html guides/characters/index.html tier-lists/legendary-items/index.html

          if git diff --staged --quiet; then
            echo "Leaderboard source is unchanged; no commit needed."
            exit 0
          fi

          git commit -m "Auto-update leaderboard data"
          git pull --rebase origin main
          git push origin HEAD:main

  notify-failure:
    needs: sync-leaderboard
    if: ${{ always() && needs.sync-leaderboard.result != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Send leaderboard failure email
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PATCH_ALERT_EMAIL: ${{ secrets.PATCH_ALERT_EMAIL }}
          AUTOMATION_DETAILS: The leaderboard sync timed out or failed during source fetch, validation, entity coverage, or Git publishing. Existing cached data is preserved when no safe replacement is available.
        run: python scripts/send_automation_alert.py failure --name "Sync Leaderboard Data"

  test-email:
    needs: sync-leaderboard
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_email == true && needs.sync-leaderboard.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Send requested Gmail test
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PATCH_ALERT_EMAIL: ${{ secrets.PATCH_ALERT_EMAIL }}
        run: python scripts/send_automation_alert.py test --name "Sync Leaderboard Data"
