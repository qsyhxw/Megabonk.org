name: Sync PokeBonk public sources
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and preview changes without committing
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/workflows/sync-pokebonk.yml']
permissions:
  contents: read
concurrency:
  group: repository-content-writes
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated public-source reader
        run: |
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/pb-runtime" playwright@1.54.0 acorn@8.15.0
          "$RUNNER_TEMP/pb-runtime/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check source adapter and fetch public data without game boot
        env:
          NODE_PATH: ${{ runner.temp }}/pb-runtime/node_modules
        run: |
          node scripts/test_pokebonk_sync_source.cjs
          timeout 5m node scripts/pokebonk_sync_source.cjs "$RUNNER_TEMP/candidate.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pokebonk-candidate
          path: ${{ runner.temp }}/candidate.json
          retention-days: 7
  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: pokebonk-candidate
          path: ${{ runner.temp }}/pb-source
      - name: Save independent pre-update baselines
        run: |
          cp config/integrations.json "$RUNNER_TEMP/pb-integrations.before.json"
          python scripts/pokebonk_sync_gate.py before "$RUNNER_TEMP/pb-before.json"
      - name: Validate and apply accepted domains
        id: sync
        run: python scripts/pokebonk_sync.py "$RUNNER_TEMP/pb-source/candidate.json"
      - name: Rebuild and validate before any push
        run: |
          python scripts/test_pokebonk_sync.py
          python scripts/test_pokebonk_sync_render.py
          python scripts/build_pokebonk.py > "$RUNNER_TEMP/pb-build.json"
          python scripts/pokebonk_sync_gate.py after "$RUNNER_TEMP/pb-before.json"
          python scripts/test_integration_guard.py
          python scripts/check_pokebonk_depth.py
          node scripts/test_pokebonk_compare.cjs
          node scripts/test_pokebonk_decisions.cjs
          node scripts/test_pokebonk_progression.cjs
          python scripts/check_guide_layout.py
          python scripts/verify_integrations.py --baseline "$RUNNER_TEMP/pb-integrations.before.json"
          git diff --check
      - name: Install browser verification
        run: |
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/pb-runtime" playwright@1.54.0
          "$RUNNER_TEMP/pb-runtime/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify responsive pages and actual tool interactions
        env:
          NODE_PATH: ${{ runner.temp }}/pb-runtime/node_modules
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/pb-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/check_pokebonk_sync_browser.cjs
      - name: Commit only validated source data and existing PokeBonk output
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/pokebonk-sync.json data/content-dates.json sitemap.xml pokebonk/
          if git diff --cached --quiet; then
            echo "Source unchanged: no commit or date refresh." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Sync validated PokeBonk source data"
          # A concurrent external push fails safely; the next check starts from fresh main.
          git push origin HEAD:main
      - name: Verify deployed snapshot and final XML response
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          NODE_PATH: ${{ runner.temp }}/pb-runtime/node_modules
        run: node scripts/check_pokebonk_sync_live.cjs
      - name: Record dry-run outcome
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: echo "Dry run validated; no commit or deployment requested." >> "$GITHUB_STEP_SUMMARY"
