<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300"><rect width="1100" height="300" fill="#eef2fb"/><path d="M0 260H1100" stroke="#c9d3ee" stroke-width="2"/><rect x="24" y="50" width="235" height="174" fill="#24479a" stroke="#24479a" stroke-width="2"/><text x="41" y="87" fill="#ffd23f" font-family="sans-serif" font-size="15" font-weight="700">01 / ELIGIBLE</text><text x="41" y="131" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="700">Map state + time</text><text x="41" y="172" fill="#c4d4f5" font-family="sans-serif" font-size="14">Boss / host conditions</text><path d="M266 134h25m-7-7 7 7-7 7" fill="none" stroke="#2f5bc0" stroke-width="2"/><rect x="297" y="50" width="235" height="174" fill="#ffffff" stroke="#24479a" stroke-width="2"/><text x="314" y="87" fill="#2f5bc0" font-family="sans-serif" font-size="15" font-weight="700">02 / OPEN</text><text x="314" y="131" fill="#24479a" font-family="sans-serif" font-size="20" font-weight="700">Random checks</text><text x="314" y="172" fill="#4b5a82" font-family="sans-serif" font-size="14">Not a fixed-time promise</text><path d="M539 134h25m-7-7 7 7-7 7" fill="none" stroke="#2f5bc0" stroke-width="2"/><rect x="570" y="50" width="235" height="174" fill="#24479a" stroke="#24479a" stroke-width="2"/><text x="587" y="87" fill="#ffd23f" font-family="sans-serif" font-size="15" font-weight="700">03 / ENTER</text><text x="587" y="131" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="700">Portal → arena timer</text><text x="587" y="172" fill="#c4d4f5" font-family="sans-serif" font-size="14">Two countdowns</text><path d="M812 134h25m-7-7 7 7-7 7" fill="none" stroke="#2f5bc0" stroke-width="2"/><rect x="843" y="50" width="235" height="174" fill="#ffffff" stroke="#24479a" stroke-width="2"/><text x="860" y="87" fill="#2f5bc0" font-family="sans-serif" font-size="15" font-weight="700">04 / RETURN</text><text x="860" y="131" fill="#24479a" font-family="sans-serif" font