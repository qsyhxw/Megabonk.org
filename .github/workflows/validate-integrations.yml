name: Validate published integrations
on:
  push:
    branches: [main]
    paths: ['**.html', '**.htm', 'scripts/**', 'assets/**', 'config/**', 'data/pokebonk-*.json', 'data/azeroth-*.json', 'data/guide-images.json', '.github/workflows/validate-integrations.yml']
  pull_request:
    paths: ['**.html', '**.htm', 'scripts/**', 'assets/**', 'config/**', 'data/pokebonk-*.json', 'data/azeroth-*.json', 'data/guide-images.json', '.github/workflows/validate-integrations.yml']
permissions:
  contents: read
jobs:
  static-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify guard rejects integration defects
        run: python scripts/test_integration_guard.py
      - name: Rebuild PokeBonk from versioned source
        run: |
          python scripts/derive_pokebonk_evolution.py
          python scripts/build_pokebonk.py
          python scripts/check_pokebonk_editorial.py
      - name: Rebuild PokeSurvivor from versioned source
        run: python scripts/build_poke_survivor.py
      - name: Rebuild main-site longtail guides
        run: python scripts/build_longtail_main.py
      - name: Rebuild Survivor Ace task pages
        run: python scripts/build_survivor_ace.py
      - name: Rebuild Azeroth Survivors guides
        run: |
          python scripts/build_azeroth_survivors.py
          python scripts/check_azeroth_editorial.py
      - name: Verify Azeroth planner rules and safe imports
        run: node scripts/test_azeroth_planner.cjs
      - name: Rebuild Arena of Champions playable entry
        run: python scripts/build_arena_champions.py
      - name: Rebuild Ball x Pit guides
        run: python scripts/build_ball_x_pit.py
      - name: Rebuild Soulstone Survivors guides
        run: python scripts/build_soulstone_survivors.py
      - name: Rebuild Warhammer Survivors reviewed task
        run: python scripts/build_warhammer_survivors.py
      - name: Rebuild D2 Survivors task pages
        run: python scripts/build_d2_survivors.py
      - name: Rebuild Spires of Azeroth section
        run: python scripts/build_spires_of_azeroth.py
      - name: Rebuild Poke Arena original-host launch guide
        run: python scripts/build_pokearena.py
      - name: Rebuild PB Ranked original-host entry
        run: python scripts/build_pokemon_battlegrounds.py
      - name: Rebuild PokéIsaac playable entry
        run: python scripts/build_pokeisaac.py
      - name: Rebuild PokéVersus playable entry
        run: python scripts/build_pokeversus.py
      - name: Rebuild PokéSolaire playable entry
        run: python scripts/build_poke_solaire.py
      - name: Rebuild PokeRogue decision guides
        run: python scripts/build_pokerogue.py
      - name: Rebuild Hordes of Azeroth guides
        run: python scripts/build_hordes_of_azeroth.py
      - name: Rebuild PokeDive lightweight tasks
        run: python scripts/build_pokedive.py
      - name: Rebuild Vampire Survivors lightweight tasks
        run: |
          python scripts/build_vampire_survivors.py
          node scripts/test_vampire_compatibility.cjs
      - name: Rebuild Risk of Rain 2 lightweight tasks
        run: |
          python scripts/build_risk_of_rain_2.py
          node scripts/test_ror2_compatibility.cjs
      - name: Build and verify game-scoped discovery
        run: |
          python scripts/build_game_discovery.py
          python scripts/check_game_navigation.py
          python scripts/check_remaining_editorial.py
          python scripts/check_game_seo.py
          python scripts/test_game_seo.py
      - name: Verify page-specific game images
        run: |
          python scripts/check_guide_images.py
          python scripts/test_image_citation_modes.py
      - name: Verify public-source sync rejects unsafe updates
        run: |
          python scripts/test_pokebonk_sync.py
          python scripts/test_pokebonk_sync_render.py
          python scripts/test_azeroth_sync.py

      - name: Verify source-derived PokeBonk task data
        run: python scripts/check_pokebonk_depth.py
      - name: Verify PokeBonk fixed-panel engine fixtures
        run: node scripts/test_pokebonk_compare.cjs
      - name: Verify current move, support and purchase decisions
        run: node scripts/test_pokebonk_decisions.cjs
      - name: Verify recorded move upgrades and planned budgets
        run: node scripts/test_pokebonk_progression.cjs
      - name: Verify shared game-section layout and comparison controls
        run: python scripts/check_guide_layout.py
      - name: Compare integration expectations with previous Git revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ci_integrations.py
